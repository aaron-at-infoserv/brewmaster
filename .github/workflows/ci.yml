name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Load-bearing. GitHub's default job timeout is 360 minutes; the planted
    # hang in next_brewer() needs to be killed in five, not six hours.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
